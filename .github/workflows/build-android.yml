name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=2048m"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync build number into app.json
        run: |
          node -e "
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json','utf8'));
          const n = parseInt('${{ github.run_number }}', 10) || 14;
          app.expo.extra.buildNumber = n;
          app.expo.ios.buildNumber = String(n);
          app.expo.android.versionCode = n;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('buildNumber set to', n);
          "

      - name: Regenerate native assets (icon, splash, etc.)
        run: npx expo prebuild --clean

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/sahla4eco.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahla4eco
          path: android/app/build/outputs/apk/release/sahla4eco.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/sahla4eco.apk
          generate_release_notes: false
